---
name: CI

# SELF-CONTAINED on purpose (#17). Every other repo delegates to
# `pr0d1r2/set-and-setting/.github/workflows/guardrails.yml`, but that workflow
# runs `nix develop`, `nix run .#confirm` and `nix build .#setting` -- all of
# which require the caller's flake to declare set-and-setting as an INPUT. This
# repo is the pin provider and must carry no such input (it re-enters the graph
# it feeds), so it runs `nix flake check` against its own vendored checks
# instead. See flake.nix and lefthook.yml for the same rationale.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Nix flake check
        run: nix flake check --print-build-logs --timeout 600

  check-darwin:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # DeterminateSystems installer reuses an existing Nix / `_nixbld` group on
      # the macos-latest image instead of erroring with eDSRecordAlreadyExists.
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Nix flake check
        run: nix flake check --print-build-logs --timeout 600
