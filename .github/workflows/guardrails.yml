---
name: Guardrails

# LOCAL copy of the fleet's guardrails workflow (#17).
#
# Every other repo calls `pr0d1r2/set-and-setting/.github/workflows/guardrails.yml`,
# but that workflow runs `nix develop`, `nix run .#confirm` and
# `nix build .#setting` -- all of which require the caller's flake to declare
# set-and-setting as an INPUT. This repo is the pin provider and must carry no
# such input (it re-enters the graph it feeds), so it runs `nix flake check`
# against its own vendored checks instead. See flake.nix for the rationale.
#
# Kept as a REUSABLE workflow called by a `guardrails` job rather than inlined
# in ci.yml, because the status contexts a reusable call produces are
# `<caller-job>/<job>` -- i.e. `guardrails / check` and
# `guardrails / check-darwin`. Those are the names branch protection requires
# and the names the rest of the fleet reports, and an inlined job would report
# as bare `check` instead, silently never satisfying the required contexts.

"on":
  workflow_call:
    inputs:
      flake-check-timeout:
        description: Timeout in seconds for nix flake check
        type: string
        default: "600"

jobs:
  # THE MERGE GATE for pin direction (V11). Deliberately ⊥ a flake check:
  # mkCheck's src is the flake source, tracked files with no .git, so a flake
  # check is a pure function of ONE tree while monotonicity needs TWO. And
  # deliberately ⊥ only the post-pin-update hook: a stale pin PR was FORWARD
  # when it was opened and turns backwards while it sits, so nothing running at
  # bump time can see it. Measured on #10 -- seven weeks open, would have moved
  # the fleet pin from 2026-09-03 back to 2026-06-30 with every guardrail green.
  #
  # Runs only on pull_request, ∵ that is where a base to compare against
  # exists; main is PR-only (C3/V5), so this gate is on every path in.
  pin-monotonic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin moves forward
        env:
          # A label is the override rather than an env edit: it is visible on
          # the thing being merged, and it expires with the PR.
          PIN_ALLOW_ROLLBACK: >-
            ${{ contains(github.event.pull_request.labels.*.name, 'pin-rollback') && '1' || '0' }}
        run: |
          git show "origin/${{ github.base_ref }}:flake.lock" >/tmp/base-flake.lock
          bash nix/check/pin_monotonic.sh /tmp/base-flake.lock flake.lock

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Nix flake check
        run: |
          nix flake check \
            --print-build-logs \
            --timeout ${{ inputs.flake-check-timeout }}

  check-darwin:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # DeterminateSystems installer reuses an existing Nix / `_nixbld` group on
      # the macos-latest image instead of erroring with eDSRecordAlreadyExists.
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Nix flake check
        run: |
          nix flake check \
            --print-build-logs \
            --timeout ${{ inputs.flake-check-timeout }}
